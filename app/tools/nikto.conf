# Kali package paths; explicit config excludes user config, CLI overrides and telemetry.
EXECDIR=/var/lib/nikto
PLUGINDIR=/var/lib/nikto/plugins
DBDIR=/var/lib/nikto/databases
TEMPLATEDIR=/var/lib/nikto/templates
NIKTODTD=/var/lib/nikto/templates/nikto.dtd
CHECKMETHODS=GET
@@DEFAULT=tests;headers;report_xml
UPDATES=no
PROMPTS=no
