# PenChecker reviewed HTTP GET check; no redirects, payloads or external callbacks.
id: penchecker-phpinfo
info:
  name: PHP configuration disclosure
  author: penchecker
  severity: medium
  description: Limited DVWA baseline signal requiring analyst validation.
http:
  - method: GET
    path: ["{{BaseURL}}/phpinfo.php"]
    redirects: false
    disable-cookie: true
    max-size: 65536
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: word
        part: body
        words: ["phpinfo()", "PHP Version", "PHP Variables"]
        condition: and
