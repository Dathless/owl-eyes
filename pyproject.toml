[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "penchecker"
version = "0.1.0"
description = "Kali DVWA lab assessment assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "httpx>=0.27,<1",
    "anyio>=4,<5",
    "jinja2>=3.1,<4",
    "defusedxml>=0.7,<1",
    "reportlab>=4.4,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1", "playwright>=1.49,<2", "pypdf>=6,<7"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = [
    "templates/*", "static/*", "static/css/*", "static/js/*.js",
    "static/js/core/*.js", "static/js/registry/*.js", "static/js/components/*.js",
    "static/js/views/*.js", "static/js/i18n/*.js", "static/fonts/*",
]
"app.tools" = ["nikto.conf", "nuclei-templates/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = '-m "not live"'
markers = ["live: requires explicit LIVE_LAB=1 and configured lab/provider access"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
